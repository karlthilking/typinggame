name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build JAR
      run: |
        mkdir build
        javac -cp src/main/java -d build src/main/java/**/*.java
        xcopy src\main\res build\ /E /I /Y
        echo Main-Class: main.TypingApp > manifest.txt
        echo. >> manifest.txt
        jar cf TypingGame.jar -C build/ .
    
    - name: Create Windows Executable  
      run: |
        jpackage --input . --name "TypingGame" --main-jar TypingGame.jar --main-class main.TypingApp --type exe --app-version 1.0 --description "Fast-Paced Typing Game"
    
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: TypingGame-Windows
        path: "TypingGame-*.exe"
